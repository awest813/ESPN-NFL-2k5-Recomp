<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>NFL2K5 web smoke</title>
<style>body{margin:0;background:#111;color:#ddd;font:13px monospace}#canvas{display:block}</style></head>
<body>
<!-- tests/web/test_web_av.js: Start runs the same launcher as the page's Play.
     ?auto=1 starts without a click, to test the "sound is off" path;
     ?rate=N runs the AudioContext at N Hz, to test resampling;
     ?env=NAME=VALUE sets an environment variable for the module. -->
<button id="start">Start</button>
<button id="sound" hidden>Sound is off</button>
<div style="position:relative;display:inline-block">
  <canvas id="canvas" tabindex="-1"></canvas>
  <canvas id="gpucanvas" hidden style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none"></canvas>
</div>
<script src="launch.js"></script>
<script>
  window.smokeLog = [];
  function go() {
    const rate = Number(new URLSearchParams(location.search).get('rate')) || undefined;
    const audio = NFL2K5Launch.createAudio(rate);
    window.smokeAudio = audio;
    NFL2K5Launch.watchSound(audio, document.getElementById('sound'));
    NFL2K5Launch.start({ script: 'web_smoke.js', factory: 'createSmoke',
      canvas: document.getElementById('canvas'), audioContext: audio,
      env: new URLSearchParams(location.search).getAll('env'),
      onGpuPresent: (on) => { window.gpuPresent = on; },
      print: (t) => { smokeLog.push(t); console.log(t); },
      printErr: (t) => { smokeLog.push(t); console.log(t); } });
  }
  document.getElementById('start').onclick = go;
  if (new URLSearchParams(location.search).get('auto') === '1') go();
</script>
</body>
</html>
