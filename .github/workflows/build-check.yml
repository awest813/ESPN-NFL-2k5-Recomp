name: Build check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Runtime functions exist
        run: python tools/ci/check-runtime-symbols.py src external/xboxrecomp/src config/xboxrecomp-web.patch

      - name: Check out pinned SDL3 source (3.2.20)
        uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL
          ref: 96292a5b464258a2b926e0a3d72f8b98c2a81aa6
          path: dependencies/SDL

      - name: Build SDL3 SDK
        run: |
          cmake -S dependencies/SDL -B build-sdl -G "Visual Studio 17 2022" -A x64 -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/dependencies/sdl3-sdk" -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
          cmake --build build-sdl --config Release --parallel
          cmake --install build-sdl --config Release

      - name: Configure CMake (Windows D3D11 + SDL3)
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DNFL2K5_BUILD_GAME=OFF -DCMAKE_PREFIX_PATH="${{ github.workspace }}/dependencies/sdl3-sdk"

      - name: Build Windows runtime and tools (no game)
        run: cmake --build build --config Release --parallel

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply published cross-platform runtime fixes
        run: git -c core.whitespace=cr-at-eol apply --ignore-space-change --directory=external/xboxrecomp config/xboxrecomp-web.patch

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libssl-dev libepoxy-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libwayland-dev libxkbcommon-dev mesa-vulkan-drivers libvulkan1 glslang-tools

      - name: Check out pinned SDL3 source (3.2.20)
        uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL
          ref: 96292a5b464258a2b926e0a3d72f8b98c2a81aa6
          path: dependencies/SDL

      - name: Build SDL3 SDK
        run: |
          cmake -S dependencies/SDL -B build-sdl -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/dependencies/sdl3-sdk" -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
          cmake --build build-sdl --parallel
          cmake --install build-sdl

      - name: Configure CMake (Linux POSIX + SDL3 GPU)
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DNFL2K5_BUILD_GAME=OFF -DCMAKE_PREFIX_PATH="${{ github.workspace }}/dependencies/sdl3-sdk"

      - name: Check POSIX condition waits and lock reacquisition
        run: |
          cmake -S external/xboxrecomp/tests/condition_srw_posix -B build-condition -G Ninja
          cmake --build build-condition
          ctest --test-dir build-condition --output-on-failure

      - name: Check acknowledgement clock and diagnostic scan bounds (sanitizers)
        run: python3 -I tests/web/test_nv2a_ack_clock.py --native --build-dir build-nv2a-clock

      - name: Check same-frame texture content and bounded memo storage (sanitizers)
        run: |
          python3 -I tests/web/test_texture_hash.py --native --build-dir build-texture-hash
          python3 -I tests/web/test_texture_hash_algo.py --native --build-dir build-texture-hash-algo

      - name: Check bulk Morton uploads against the live texture sampler (sanitizers)
        run: python3 -I tests/web/test_texture_swizzled.py --native --build-dir build-texture-swizzled

      - name: Check committed texture lookup and invalidation (sanitizers)
        run: python3 -I tests/web/test_texture_lookup.py --native --build-dir build-texture-lookup

      - name: Check scripted controller pulse timing (sanitizers)
        run: python3 -I tests/web/test_scripted_input.py --native --build-dir build-scripted-input

      - name: Check prepared vertex stream packing (address sanitizer)
        run: python3 -I tests/web/test_vertex_fetch.py --native --build-dir build-vertex-streams

      - name: Check WebGPU uniform history and bounded reuse (sanitizers)
        run: python3 -I tests/web/test_webgpu_uniforms.py --native --build-dir build-webgpu-uniforms

      - name: Check widescreen menu and world transitions (sanitizers)
        run: python3 -I tests/web/test_widescreen.py --native --build-dir build-widescreen

      - name: Check bounded APU register handoff under continuous arrivals (sanitizers)
        run: python3 -I tests/web/test_apu_lock_handoff.py --native --build-dir build-apu-handoff

      - name: Check optional APU audio clock wakes and condition handoff (sanitizers)
        run: python3 -I tests/web/test_apu_audio_wake.py --native --build-dir build-apu-audio-wake

      - name: Check optional IRQ phase measurements and disabled clock overhead (sanitizers)
        run: python3 -I tests/web/test_irq_profile.py --native --build-dir build-irq-profile

      - name: Check real AC97 faults and guest-memory copy boundaries
        run: |
          cmake -S external/xboxrecomp/tests/ac97_posix -B build-ac97 -G Ninja
          cmake --build build-ac97
          ctest --test-dir build-ac97 --output-on-failure
          cmake -S tests/guest_memory_posix -B build-guest-memory -G Ninja
          cmake --build build-guest-memory
          ctest --test-dir build-guest-memory --output-on-failure
          cmake -S external/xboxrecomp/tests/renderer_staging -B build-renderer -G Ninja -DCMAKE_PREFIX_PATH="${{ github.workspace }}/dependencies/sdl3-sdk"
          cmake --build build-renderer
          ctest --test-dir build-renderer --output-on-failure
          cmake -S external/xboxrecomp/tests/apu_mmio_decode_posix -B build-apu-decode -G Ninja
          cmake --build build-apu-decode
          ctest --test-dir build-apu-decode --output-on-failure
          cmake -S external/xboxrecomp/tests/guest_memory_direct_posix -B build-gm-direct -G Ninja
          cmake --build build-gm-direct
          ctest --test-dir build-gm-direct --output-on-failure
          # SDL3 GPU renderer on Mesa's software Vulkan (lavapipe)
          cmake -S external/xboxrecomp/tests/sdlgpu_posix -B build-sdlgpu -G Ninja -DCMAKE_PREFIX_PATH="${{ github.workspace }}/dependencies/sdl3-sdk"
          cmake --build build-sdlgpu
          LD_LIBRARY_PATH="${{ github.workspace }}/dependencies/sdl3-sdk/lib" ctest --test-dir build-sdlgpu --output-on-failure

      - name: Build Linux runtime (no game)
        run: cmake --build build --parallel

  # WebAssembly (docs/WEB.md). Every push compiles the runtime and the
  # hand-written game sources; the full game link (220 MB of generated C)
  # runs only on manual dispatch because it takes far longer than the rest.
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build xvfb

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 7.0.0   # the version tools/build-web.sh was verified with

      - name: Runtime and game sources (no generated code)
        run: tools/build-web.sh --no-gen

      - name: Playwright and Chromium (browser tests)
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Web tests (address space, APU routing, audio/video/input)
        run: xvfb-run -a tools/test-web.sh

      - name: Full game link
        if: github.event_name == 'workflow_dispatch'
        run: JOBS=3 tools/build-web.sh

      - name: Web page test (headless Chromium)
        if: github.event_name == 'workflow_dispatch'
        run: node tests/web/test_web_page.js build-web

      - name: Upload web build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: nfl2k5-web
          path: |
            build-web/*.html
            build-web/*.css
            build-web/*.js
            build-web/*.wasm
